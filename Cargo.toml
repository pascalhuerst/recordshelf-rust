[package]
name = "recordshelf-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
ctrlc = "3.4"
evdev = "0.13"
eframe = { version = "0.27", features = ["default_fonts", "wgpu"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
open = "5"
toml = "0.8"
dirs = "5"
scraper = "0.20"
tiny_http = "0.12"
url = "2"
egui_extras = { version = "0.27", features = ["image"] }
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }
qrcode = { version = "0.14", default-features = false }
ab_glyph = "0.2"
barcoders = { version = "2", default-features = false, features = ["std"] }
postgres = "0.19"
sha2 = "0.10"

[dev-dependencies]
libc = "0.2.191"
rxing = "0.9"
tempfile = "3.27.0"
